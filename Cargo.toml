[package]
name = "fw-fan-quiet"
version = "0.1.0"
edition = "2024"
# >= 1.87: Linux Instant is CLOCK_BOOTTIME-backed (advances during suspend),
# which resume detection (sensors::sampler::is_resume_gap) depends on.
rust-version = "1.87"

[dependencies]
# Wrapped result height is used to keep calibration scrolling in bounds.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
crossbeam-channel = "0.5"
nvml-wrapper = "0.12"
pid = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: lossless f64 persistence (thermal model params in state.json)
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
signal-hook = "0.3"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
# LED matrix output (Framework 16 modules over USB CDC-ACM). termios puts the
# tty into raw mode so binary frames aren't mangled; libc supplies O_NOCTTY.
# Both are already in the tree transitively, so they add no new build cost.
termios = "0.3"
libc = "0.2"
